<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171918"><title>Test intro 3D · Couche par couche</title><style>:root{--ink:#171918;--paper:#f5f5ef;--orange:#ff5b2d}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--paper);font-family:Arial,Helvetica,sans-serif;color:var(--ink)}main{height:100svh;position:relative;display:flex;flex-direction:column;padding:5vh 5vw}.brand{font-size:12px;font-weight:800;letter-spacing:1.7px;z-index:2}.copy{position:relative;z-index:2;margin:auto 0;width:min(680px,58vw)}h1{font-size:clamp(58px,7.4vw,118px);line-height:.88;letter-spacing:-.07em;margin:0;font-weight:800}h1 span{color:var(--orange)}.hint{position:absolute;right:4vw;bottom:4vh;font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.55;z-index:2}.badge{position:absolute;left:5vw;bottom:4vh;font-size:11px;opacity:.5;z-index:2}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:manipulation}canvas.paused{opacity:.78}@media(max-width:700px){.copy{width:72vw}h1{font-size:clamp(52px,16vw,90px)}.hint{right:5vw;max-width:130px;text-align:right}}@media(prefers-reduced-motion:reduce){.hint{display:none}}</style></head><body><main><div class="brand">COUCHE PAR COUCHE</div><div class="copy"><h1>Tout commence<br>par une <span>idée.</span></h1></div><div class="badge">APERÇU 3D · TEST</div><div class="hint">Touchez la forme pour mettre en pause</div><canvas id="relief" aria-label="Relief abstrait construit couche par couche"></canvas></main><script>const c=document.querySelector('#relief'),x=c.getContext('2d'),reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;let start=performance.now(),paused=false,pauseAt=0,totalPause=0,W=0,H=0,D=1;function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}function profile(u,z){const dome=Math.pow(Math.max(0,1-u*u),.58);const notch=1-.16*Math.exp(-Math.pow((u-.28)*4.5,2));return dome*notch*(.82+.18*Math.sin(z*5.4+u*2.2))}function frame(now){if(paused)return;const t=reduced?20:(now-start-totalPause)/1000,build=Math.min(1,t/4.2),turn=reduced?.7:t*.18; x.clearRect(0,0,W,H);const cx=W*.73,cy=H*.50,S=Math.min(W,H)*.52,L=64,n=Math.max(1,Math.floor(L*build));x.save();x.translate(cx,cy);x.rotate(-.07);for(let i=0;i<n;i++){const z=i/(L-1),yy=(z-.5)*S*.92,r=S*(.16+.46*Math.sin(Math.PI*(.05+z*.9))),persp=.78+.22*Math.cos(turn),shift=Math.sin(turn)*S*.14*(z-.38);x.beginPath();for(let k=0;k<=80;k++){const u=k/80*2-1,xx=shift+u*r*persp,y=yy-profile(u,z)*r*(.17+.12*Math.cos(turn));k?x.lineTo(xx,y):x.moveTo(xx,y)}x.strokeStyle='rgba(255,91,45,'+(.12+.76*z)+')';x.lineWidth=1.05;x.stroke()}x.restore();if(!reduced)requestAnimationFrame(frame)}c.addEventListener('pointerup',()=>{if(reduced)return;if(paused){totalPause+=performance.now()-pauseAt;paused=false;c.classList.remove('paused');requestAnimationFrame(frame)}else{paused=true;pauseAt=performance.now();c.classList.add('paused')}});addEventListener('resize',resize,{passive:true});resize();requestAnimationFrame(frame)</script></body></html>
